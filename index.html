<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bông Hoa Nở - For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas sân khấu chính 3D -->
  <div class="stage-container" id="stageContainer">
    <canvas id="bloomCanvas"></canvas>

    <!-- Dòng chữ lãng mạn -->
    <header class="romantic-header" id="romanticHeader">
      <h1 class="main-title">for You</h1>
      <p class="sub-title">with love</p>
    </header>

    <!-- Nút bật/tắt nhạc (Mặc định: BẬT) -->
    <button class="audio-btn" id="audioBtn" title="Bật / Tắt nhạc nền">
      <svg id="iconSoundOn" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <svg id="iconSoundOff" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>

    <!-- Hướng dẫn nhẹ nhàng khi mới vào -->
    <div class="hint-overlay" id="hintOverlay">
      <span>Chạm vào màn hình để tương tác & phát lại</span>
    </div>
  </div>

  <!-- Three.js (Hỗ trợ cả offline nội bộ và CDN dự phòng) -->
  <script src="three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
